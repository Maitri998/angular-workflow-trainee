<h1>Workflow Management Application</h1>

<div *ngIf="workflows$ | async as workflows; else loading">
 
<app-workflow-list
    [workflows]= "workflows"
    (workflowSelected)="onWorkflowSelected($event)">
</app-workflow-list>

</div>

<ng-template #loading>
  <p>Loading workflows...</p>
</ng-template>
